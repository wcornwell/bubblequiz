# Runs R CMD check (which also runs the testthat suite and tests/*.R scripts)
# on every push to main and on every pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs CRAN dependencies plus the system libraries they need
      # (libmagick++ for magick, qpdf, etc.) on Ubuntu.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::pkgload
          needs: check

      # The check suite does not call xelatex or zbarimg, but install them so
      # any future test that exercises rendering or QR decoding can run here.
      - name: Install external tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils imagemagick qpdf zbar-tools \
            texlive-xetex texlive-latex-extra

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'

      # The real-scan fixture and the worked example are left out of the built
      # package, so R CMD check skips the tests that mark them. Run the suite
      # again from the source tree, where they are present.
      - name: Test against real scans (source tree)
        run: Rscript -e 'testthat::test_local(reporter = "summary")'
